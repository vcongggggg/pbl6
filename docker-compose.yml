services:
  # Target Web API: Bookie Bookstore (Vulnerable Web API tự xây dựng)
  vulnerable-api:
    build:
      context: ./vulnerable-api
      dockerfile: Dockerfile
    container_name: pbl6-vulnerable-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DJANGO_ENV=development
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - PORT=5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/vulnerable/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pbl6-network

  # FastAPI WAF Gateway / Reverse Proxy Layer
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: pbl6-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////app/data/waf_security.db
      - TARGET_API_URL=http://vulnerable-api:5000
      - WAF_MODE=MONITOR_ONLY
      - ADMIN_API_KEY=dev-admin-secret-key-change-me
    volumes:
      - ./data:/app/data
      - ./ml-engine/artifacts:/app/ml-engine/artifacts:ro
    depends_on:
      vulnerable-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pbl6-network

  # Next.js Dashboard Frontend
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: pbl6-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - pbl6-network

networks:
  pbl6-network:
    name: pbl6-network
    driver: bridge
