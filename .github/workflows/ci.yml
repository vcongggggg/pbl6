name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Lint & Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e gateway/
          pip install pytest pytest-asyncio pytest-cov respx ruff joblib numpy scikit-learn pandas xgboost

      - name: Run Ruff Linter (Full Codebase)
        run: |
          ruff check gateway/ ml-engine/ attack-lab/

      - name: Run Pytest Test Suites with Coverage (Gateway, Unit & ML Engine)
        run: |
          python -m pytest gateway/tests/ tests/unit/ ml-engine/tests/ --cov=gateway/app/security --cov=gateway/app/api --cov-fail-under=80

      - name: Verify Quality Gates (PBL6 v3.2 Phase D5)
        run: |
          python scripts/verify_quality_gates.py

  frontend-checks:
    name: Frontend Lint, Typecheck & Build (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Run ESLint
        run: |
          cd dashboard
          npm run lint

      - name: TypeScript Typecheck
        run: |
          cd dashboard
          npx tsc --noEmit

      - name: Build Next.js Application
        run: |
          cd dashboard
          npm run build
