name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Lint & Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e gateway/
          pip install pytest pytest-asyncio pytest-cov respx ruff joblib numpy scikit-learn pandas

      - name: Run Ruff Linter
        run: |
          ruff check gateway/ scripts/run_ablation_study.py scripts/generate_benchmark_dataset.py

      - name: Run Pytest Test Suite
        run: |
          python -m pytest gateway/tests/

  frontend-checks:
    name: Frontend Build & Typecheck (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build Next.js Application
        run: |
          cd dashboard
          npm run build
